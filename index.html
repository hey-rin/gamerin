<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="흑돌과 백돌로 즐기는 3단계 인공지능 오목 게임"><meta name="theme-color" content="#17130f"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d39a4a'/%3E%3Cpath d='M0 21h64M0 43h64M21 0v64M43 0v64' stroke='%23724a20' stroke-width='2'/%3E%3Ccircle cx='22' cy='22' r='13' fill='%231a1816'/%3E%3Ccircle cx='43' cy='43' r='13' fill='%23f5f1e8' stroke='%23aaa'/%3E%3C/svg%3E"><title>오목 한판</title><link rel="stylesheet" href="styles.css"></head><body>
<canvas id="confettiCanvas" aria-hidden="true"></canvas><main class="app-shell"><header class="topbar"><a class="brand" href="#" aria-label="오목 한판 처음으로"><span class="brand-stones" aria-hidden="true"><i></i><i></i></span><span>오목 <b>한판</b></span></a><button class="sound-button" id="soundButton" type="button" aria-pressed="true" aria-label="효과음 끄기">♪</button></header>
<section class="intro"><div><p class="eyebrow">FIVE IN A ROW</p><h1>생각은 깊게,<br><em>한 수는 담대하게.</em></h1></div><p>당신은 흑돌입니다. 가로, 세로, 대각선 중 먼저 다섯 개를 이으면 승리합니다.</p></section>
<section class="game-layout"><div class="board-wrap"><div class="board-topline"><div class="turn-indicator" id="turnIndicator"><span class="stone black"></span><strong>당신의 차례</strong></div><span class="move-count">놓은 돌 <b id="moveCount">0</b></span></div><canvas id="board" width="720" height="720" aria-label="15 곱하기 15 오목판. 교차점을 눌러 흑돌을 놓으세요." role="img"></canvas></div>
<aside class="control-panel"><section><p class="panel-label">난이도</p><div class="level-tabs" role="radiogroup" aria-label="게임 난이도"><button type="button" role="radio" aria-checked="true" data-level="1"><b>1</b><span>가볍게</span></button><button type="button" role="radio" aria-checked="false" data-level="2"><b>2</b><span>도전</span></button><button type="button" role="radio" aria-checked="false" data-level="3"><b>3</b><span>집중</span></button></div><p class="level-description" id="levelDescription">처음 즐기기 좋은 여유로운 상대입니다.</p></section>
<section class="players"><p class="panel-label">대국자</p><div class="player active" id="humanPlayer"><span class="stone black"></span><div><strong>나</strong><small>흑돌 · 선공</small></div><em>생각 중</em></div><div class="versus">VS</div><div class="player" id="aiPlayer"><span class="stone white"></span><div><strong>컴퓨터</strong><small>백돌 · AI</small></div><em>대기</em></div></section>
<section class="rule-card"><p class="panel-label">승리 조건</p><div class="five-stones" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><p>같은 색 돌 5개를 끊김 없이 이으면 즉시 승리합니다. 시간 제한은 없습니다.</p></section><button class="new-game-button" id="newGameButton" type="button">새 대국 시작</button></aside></section></main>
<div class="result-overlay" id="resultOverlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="result-card"><div class="result-stones" id="resultStones" aria-hidden="true"></div><p class="eyebrow" id="resultEyebrow">GAME SET</p><h2 id="resultTitle">흑돌 승리!</h2><p id="resultMessage">멋진 수였습니다. 다섯 개의 돌을 먼저 이었습니다.</p><button class="new-game-button" id="playAgainButton" type="button">한 판 더</button><button class="close-button" id="closeResultButton" type="button">바둑판 다시 보기</button></div></div><script src="game.js"></script></body></html>
